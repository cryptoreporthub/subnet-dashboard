name: Claude review

# Reviews every push to a ready, same-repository pull request. It listens to
# pull_request, never to comments, so a bot comment cannot start a run that
# holds the repo secret. Fork PRs and drafts are skipped.
# Requires the repo secret CLAUDE_CODE_OAUTH_TOKEN.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Best-effort scrub of Anthropic and GitHub secrets from Bash child processes.
      # Opt-in in the action; off unless set. Reduces, does not eliminate, exposure.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Record job start
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Review pull request
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          # The job-scoped workflow token limits this run to the permissions above.
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Cursor opens same-repo PRs as this bot. Only this one bot is allowed.
          allowed_bots: "cursor[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs, security issues and unclear code.
            The PR's merge commit is checked out. Use `gh pr diff` for the changes.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for issues in specific lines, and `gh pr comment` for a summary.
            Only post GitHub comments. Do not edit files.
          # Same model as the mention workflow, to keep subscription quota low.
          claude_args: >-
            --model haiku
            --permission-mode default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read(./**),Grep(./**),Glob(./**)"
            --disallowedTools "Read(//proc/**),Grep(//proc/**),Glob(//proc/**)"
      - name: Fail if no review or summary was posted
        # A green run that posted nothing looks like a passed review. The action hides
        # tool output, so check GitHub for what this job's token (github-actions[bot])
        # posted since the job started. Read-only: it adds no permission.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          posted=0
          for path in "issues/${PR}/comments" "pulls/${PR}/reviews" "pulls/${PR}/comments"; do
            n=$(gh api --paginate "repos/${REPO}/${path}" | jq -s --arg since "$SINCE" \
              '[.[][] | select(.user.login == "github-actions[bot]" and ((.created_at // .submitted_at) >= $since))] | length')
            echo "${path}: ${n} new from github-actions[bot] since ${SINCE}"
            posted=$((posted + n))
          done
          if [ "$posted" -eq 0 ]; then
            echo "::error::Claude review run finished but posted no review or comment on PR ${PR}."
            exit 1
          fi
