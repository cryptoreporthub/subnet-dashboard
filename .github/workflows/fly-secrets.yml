name: Fly set secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fly-secrets.yml

jobs:
  set-secrets:
    name: Set subnet-dashboard secrets
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      # ponytail: WORKER_HEAVY=full wedges the single 2GB machine (live-subnet sync).
      # Keep essential for pump/resolver/score snapshots; enable Telegram manually
      # only after soak passes (see DEPLOY.md).
      - name: Stable inline worker secrets
        run: flyctl secrets set WORKER_HEAVY=essential MESSAGE_INTEL_LISTENER=off --app subnet-dashboard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
