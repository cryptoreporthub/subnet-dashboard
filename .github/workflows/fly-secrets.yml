name: Fly set secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fly-secrets.yml

jobs:
  set-secrets:
    name: Set subnet-dashboard secrets
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      # ponytail: WORKER_HEAVY=essential is for v1 inline worker on web VM only.
      # split_v2 dedicated worker forces full in scripts/fly_worker_entrypoint.sh.
      - name: Telegram on essential worker (v1 inline / web)
        run: flyctl secrets set MESSAGE_INTEL_LISTENER=auto WORKER_HEAVY=essential --app subnet-dashboard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
