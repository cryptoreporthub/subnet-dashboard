name: Fly set secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fly-secrets.yml

jobs:
  set-secrets:
    name: Set subnet-dashboard secrets
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      # ponytail: WORKER_HEAVY=full wedges the single 2GB machine (live-subnet sync).
      # Telegram runs on essential worker with deferred boot (see background_boot.py).
      - name: Telegram on essential worker
        run: flyctl secrets set MESSAGE_INTEL_LISTENER=auto WORKER_HEAVY=essential --app subnet-dashboard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
