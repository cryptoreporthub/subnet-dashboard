name: Fly set secrets

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Name of the single secret to set (e.g. FINNEY_RPC_URL). Must match ^[A-Z][A-Z0-9_]*$. Dispatch only."
        required: true
        type: string
      secret_value:
        description: "Value to store for the secret named in secret_name. Dispatch only."
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/fly-secrets.yml

jobs:
  set-secrets:
    name: Set subnet-dashboard secrets
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      # Dispatch-only path: sets exactly ONE named secret passed via inputs.
      - name: Set one named secret (dispatch only)
        if: "github.event_name == 'workflow_dispatch' && inputs.secret_name != '' && inputs.secret_value != ''"
        run: |
          if ! printf '%s' "$SECRET_NAME" | grep -qE '^[A-Z][A-Z0-9_]*$'; then
            echo "ERROR: SECRET_NAME '$SECRET_NAME' must match ^[A-Z][A-Z0-9_]*$" >&2
            exit 1
          fi
          if [ -z "$SECRET_VALUE" ]; then
            echo "ERROR: SECRET_VALUE must be non-empty" >&2
            exit 1
          fi
          flyctl secrets set "$SECRET_NAME=$SECRET_VALUE" -a subnet-dashboard
        env:
          SECRET_NAME: ${{ inputs.secret_name }}
          SECRET_VALUE: ${{ inputs.secret_value }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # ponytail: WORKER_HEAVY=essential is for v1 inline worker on web VM only.
      # split_v2 dedicated worker forces full in scripts/fly_worker_entrypoint.sh.
      - name: Telegram on essential worker (v1 inline / web)
        if: github.event_name == 'push'
        run: flyctl secrets set MESSAGE_INTEL_LISTENER=auto WORKER_HEAVY=essential TELEGRAM_TREND_ALERT=on TELEGRAM_GAINERS_ALERT=on TELEGRAM_STAKE_ALERT=on --app subnet-dashboard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
