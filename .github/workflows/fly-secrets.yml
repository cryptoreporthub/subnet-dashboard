name: Fly set secrets

on:
  workflow_dispatch:

jobs:
  set-secrets:
    name: Set subnet-dashboard secrets
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Enable Telegram listener + heavy worker
        run: flyctl secrets set MESSAGE_INTEL_LISTENER=auto WORKER_HEAVY=full --app subnet-dashboard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
