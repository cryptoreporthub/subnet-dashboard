name: Patch D apply snapshot telemetry

on:
  push:
    branches:
      - patchd/snapshot-build-telemetry

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply surgical telemetry patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('internal/council/score_snapshots.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import logging\nimport os\nimport threading\nfrom concurrent.futures import ThreadPoolExecutor, TimeoutError as FuturesTimeoutError\n",
                  "import logging\nimport os\nimport threading\nimport time\nfrom concurrent.futures import ThreadPoolExecutor, TimeoutError as FuturesTimeoutError\n",
              ),
              (
                  "        ctx = _market_context_with_weights(subnets or [])\n    except Exception as exc:\n        return {\"ok\": False, \"error\": f\"subnet load: {exc}\"}\n",
                  "        ctx = _market_context_with_weights(subnets or [])\n        logger.info(\n            \"score snapshot build started: source=%s registry_only=%s subnets=%d\",\n            source,\n            _registry_only_snapshot(),\n            len(subnets or []),\n        )\n    except Exception as exc:\n        return {\"ok\": False, \"error\": f\"subnet load: {exc}\"}\n",
              ),
              (
                  "    global _write_executor, _write_future\n    with _lock:\n",
                  "    global _write_executor, _write_future\n    build_started_mono = time.monotonic()\n    build_started_wall = _now_iso()\n    caller_abandoned = threading.Event()\n    with _lock:\n",
              ),
              (
                  "    fut.add_done_callback(_release_write_future)\n    try:\n        return fut.result(timeout=timeout)\n",
                  '''    fut.add_done_callback(_release_write_future)

    def _log_build_completion(done_fut: Any) -> None:
        """Telemetry for builds that outlive their caller's timeout.

        On timeout the caller gives up but the single-flight build keeps
        running; its write is atomic (tmp + os.replace) and idempotent, so a
        late completion is benign — but a slow crawl toward the staleness
        gate was previously invisible. Logs start time, duration, and
        whether the caller had already abandoned.
        """
        duration_s = time.monotonic() - build_started_mono
        try:
            err = done_fut.exception(timeout=0)
        except Exception:
            err = None  # cancelled
        if err is not None:
            logger.warning(
                "score snapshot build failed: duration=%.1fs started_at=%s",
                duration_s,
                build_started_wall,
            )
            return
        state = "completed-after-abandon" if caller_abandoned.is_set() else "completed"
        logger.info(
            "score snapshot build %s: duration=%.1fs started_at=%s",
            state,
            duration_s,
            build_started_wall,
        )

    fut.add_done_callback(_log_build_completion)
    try:
        return fut.result(timeout=timeout)
''',
              ),
              (
                  '    except FuturesTimeoutError:\n        logger.warning("score snapshot write timed out after %ds", timeout)\n        return {"ok": False, "error": f"write_timeout_{timeout}s"}\n',
                  '''    except FuturesTimeoutError:
        caller_abandoned.set()
        logger.warning(
            "score snapshot build timed out after %ds (build continues in background)",
            timeout,
        )
        return {"ok": False, "error": f"write_timeout_{timeout}s"}
''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'anchor count {count} for: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Applied 5 surgical replacements')
          PY

      - name: Syntax check
        run: python -c "import ast; ast.parse(open('internal/council/score_snapshots.py', encoding='utf-8').read())"

      - name: Targeted tests
        run: python -m pytest tests/ -k "snapshot or correlat or patchd"

      - name: Commit patch and remove applicator
        shell: bash
        run: |
          git diff --check
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/ci-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/council/score_snapshots.py
          git rm .github/workflows/patchd-apply-snapshot-telemetry.yml
          git commit -m "Patch D A4.6 Phase 2b: score snapshot build telemetry + log-label fix"
          git push origin HEAD:${{ github.ref_name }}
