---
name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  healthcheck:
    name: Probe live endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /health (liveness)
        id: health
        run: |
          code=$(curl -sS -m 20 -o /tmp/health_body -w "%{http_code}" https://subnet-dashboard.fly.dev/health || echo 000)
          body=$(cat /tmp/health_body 2>/dev/null || true)
          echo "health_http=$code body=$body"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "body=$body" >> "$GITHUB_OUTPUT"

      - name: Probe /api/ops/live (readiness)
        id: live
        run: |
          code=$(curl -sS -m 20 -o /tmp/live_body -w "%{http_code}" https://subnet-dashboard.fly.dev/api/ops/live || echo 000)
          body=$(cat /tmp/live_body 2>/dev/null || true)
          echo "live_http=$code body=$body"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "body=$body" >> "$GITHUB_OUTPUT"

      - name: Probe / (homepage shell, must not 5xx)
        id: home
        run: |
          code=$(curl -sS -m 20 -o /tmp/home_body -w "%{http_code}" https://subnet-dashboard.fly.dev/ || echo 000)
          echo "home_http=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check results
        id: verdict
        env:
          HEALTH: ${{ steps.health.outputs.code }}
          LIVE: ${{ steps.live.outputs.code }}
          HOME: ${{ steps.home.outputs.code }}
        run: |
          ok=1
          [ "$HEALTH" = "200" ] || { echo "::error::/health returned $HEALTH (expected 200)"; ok=0; }
          [ "$LIVE" = "200" ] || { echo "::error::/api/ops/live returned $LIVE (expected 200)"; ok=0; }
          case "$HOME" in
            200|301|302) ;;
            *) echo "::error::/ returned $HOME (expected 2xx/3xx)"; ok=0 ;;
          esac
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "ALL_OK=$ok"
          [ "$ok" = "1" ] || exit 1

      - name: Open alert issue on repeated failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = "cryptoreporthub";
            const repo = "subnet-dashboard";
            const now = new Date().toISOString();
            const title = `[Uptime] site unhealthy — ${now}`;
            const find = await github.rest.issues.listForRepo({
              owner, repo, state: "open",
              labels: ["uptime-alert"],
              per_page: 1
            });
            if (find.data.length > 0) {
              console.log("Open alert already exists, skipping duplicate: #" + find.data[0].number);
              return;
            }
            const body = [
              "## Uptime monitor flagged the site as unhealthy",
              "",
              `- Checked at: \`${now}\``,
              `- /health: \`${{ steps.health.outputs.code }}\` body: \`${{ steps.health.outputs.body }}\``,
              `- /api/ops/live: \`${{ steps.live.outputs.code }}\` body: \`${{ steps.live.outputs.body }}\``,
              `- /: \`${{ steps.home.outputs.code }}\``,
              "",
              "This runs on a schedule independent of deploy CI, so a machine that wedges",
              "with no deploys happening will be caught here.",
              "",
              "Actions run: https://github.com/cryptoreporthub/subnet-dashboard/actions/workflows/uptime_monitor.yml"
            ].join("\n");
            await github.rest.issues.create({ owner, repo, title, body, labels: ["uptime-alert"] });
            console.log("Opened alert issue");
---
