# Stage 2b representative soak — real worker load + instrumentation.
# Run AFTER scripts/fly_stage2_representative_worker.sh (NOT hop overlay).
name: Fly Stage 2 representative soak

on:
  workflow_dispatch:
    inputs:
      soak_hours:
        description: "Soak duration in hours (default 4)"
        required: false
        default: "4"
      probe_interval_seconds:
        description: "Seconds between probes (default 300 = 5 min)"
        required: false
        default: "300"
      confirm:
        description: "Type soak-representative to start"
        required: true
        default: ""

jobs:
  stage2-representative-soak:
    name: Stage 2b representative soak
    runs-on: ubuntu-latest
    timeout-minutes: 259
    if: github.event.inputs.confirm == 'soak-representative'
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Preflight — representative topology
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP=subnet-dashboard
          if flyctl secrets list -a "$APP" --json | python3 -c "
          import json, sys
          rows = json.load(sys.stdin)
          bad = [r['Name'] for r in rows if r.get('Name') in ('WORKER_SPLIT_V2', 'WORKER_INTERNAL_URL')]
          sys.exit(1 if bad else 0)
          "; then
            echo "OK: WORKER_SPLIT_V2 / WORKER_INTERNAL_URL not set"
          else
            echo "ABORT: representative soak forbids split_v2 secrets"
            exit 1
          fi
          flyctl machines list -a "$APP" --json | python3 -c "
          import json, sys
          machines = json.load(sys.stdin)
          worker_vol = web_vol = 0
          for m in machines:
              meta = (m.get('config') or {}).get('metadata') or {}
              pg = (meta.get('fly_process_group') or m.get('process_group') or 'web').lower()
              mounts = (m.get('config') or {}).get('mounts') or []
              if not mounts:
                  continue
              if pg == 'worker':
                  worker_vol += 1
              elif pg == 'web':
                  web_vol += 1
          print(f'worker_with_volume={worker_vol} web_with_volume={web_vol}')
          if worker_vol < 1:
              print('ABORT: no worker with data_volume — run fly_stage2_representative_worker.sh')
              sys.exit(1)
          if web_vol > 0:
              print('WARN: web still has volume mount — not representative topology')
          "

      - name: v1 freshness gate (pre-soak)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          chmod +x scripts/fly_v1_freshness_gate.sh
          ./scripts/fly_v1_freshness_gate.sh

      - name: Run representative soak + instrumentation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: subnet-dashboard
          SOAK_HOURS: ${{ github.event.inputs.soak_hours }}
          PROBE_INTERVAL_SECONDS: ${{ github.event.inputs.probe_interval_seconds }}
          SOAK_LOG: stage2_representative_soak_${{ github.run_id }}.log
          SOAK_SAMPLES_LOG: soak_samples_${{ github.run_id }}.jsonl
          SOAK_INSTRUMENT: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/fly_soak_probe_worker.sh scripts/fly_stage2_soak_sample.sh scripts/fly_probe_worker_from_web.sh
          ./scripts/fly_soak_probe_worker.sh | tee soak-console.log

      - name: Validate soak log
        run: |
          LOG=$(ls stage2_representative_soak_*.log 2>/dev/null | head -1)
          test -n "$LOG"
          python3 scripts/validate_stage2_soak_log.py "$LOG"

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-representative-soak-${{ github.run_id }}
          path: |
            stage2_representative_soak_*.log
            soak_samples_*.jsonl
            soak-console.log
          if-no-files-found: warn
