name: Verbose CI Logger

# Side-channel diagnostics for the liveness migration branches.
# Runs the same pytest set as the ci-smoke gate, captures FULL output,
# chunks it, and commits the log + chunked source snapshots back to the
# branch so they can be read without admin log access.
# NOTE: pushes made with GITHUB_TOKEN never trigger new workflow runs,
# so the log commit cannot recurse.
# Remove this file once the migration series completes.

on:
  push:
    branches: ["liveness-*"]

permissions:
  contents: write

concurrency:
  group: ci-verbose-${{ github.ref }}

jobs:
  log-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Snapshot sources under test (chunked for readback)
        run: |
          mkdir -p _ci/snapshot
          for f in \
            internal/council/resolver_scheduler.py \
            tests/test_resolver_scheduler.py \
            internal/liveness.py \
            tests/liveness_conformance.py; do
            flat=$(echo "$f" | tr '/' '__')
            cp "$f" "_ci/snapshot/$flat"
            split -b 6000 -d "_ci/snapshot/$flat" "_ci/snapshot/$flat.part-"
            rm "_ci/snapshot/$flat"
          done
          ls -la _ci/snapshot

      - name: Run liveness-relevant tests (full output captured)
        run: |
          set +e
          DISABLE_BACKGROUND_SCANS=1 python -m pytest \
            tests/test_liveness_tracker.py \
            tests/test_no_handrolled_liveness.py \
            tests/test_resolver_scheduler.py \
            tests/test_endpoint_contract.py \
            tests/test_server.py \
            tests/test_learning_loop_health.py \
            -q --tb=long -rA > _ci/pytest-log.txt 2>&1
          ec=$?
          echo "" >> _ci/pytest-log.txt
          echo "PYTEST_EXIT_CODE=$ec" >> _ci/pytest-log.txt
          split -b 6000 -d _ci/pytest-log.txt _ci/snapshot/pytest-log.part-
          ls -la _ci/snapshot
          exit 0

      - name: Commit logs back to branch
        run: |
          git config user.name "ci-verbose-bot"
          git config user.email "noreply@github.com"
          git add _ci
          git commit -m "ci(verbose): test log + source snapshot [bot]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
