# Required PR/main gate — single job named "smoke" (branch protection).
# Homepage hydration smoke is also registered below; this comment commit re-queues PR validation.
# Replaces the old health-only smoke + duplicate ci-check + Phase K gate stack.
name: CI Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx bandit
      - name: Static foundation guards
        run: |
          set -e
          grep -qi fastapi requirements.txt
          grep -qi uvicorn requirements.txt
          grep -qi uvicorn Procfile
          test ! -d server
          test ! -f server_original.py
      - name: Compile server entrypoint
        run: python -m py_compile server.py
      - name: Endpoint contract + server + learning loop tests
        env:
          DISABLE_BACKGROUND_SCANS: "1"
        run: |
          python -m pytest tests/test_endpoint_contract.py tests/test_server.py \
            tests/test_learning_loop_health.py \
            tests/test_prediction_loop_closure.py \
            tests/test_learning_loop_impact.py \
            tests/test_audit_remediation.py \
            tests/test_phase_f_sqlite_store.py \
            tests/test_council_side_effect_honesty.py \
            tests/test_dpick_latency_logging.py \
            tests/test_dpick_parallel_fetch.py -q
      - name: Homepage hydration smoke
        timeout-minutes: 2
        env:
          DISABLE_BACKGROUND_SCANS: "1"
        run: |
          set +e
          out=$(mktemp)
          timeout 45 python -m pytest tests/test_homepage_hydration_smoke.py -q >"$out" 2>&1
          ec=$?
          cat "$out"
          if [ "$ec" -eq 0 ]; then exit 0; fi
          # Tests can pass then hang on TestClient/lifespan thread shutdown.
          if [ "$ec" -eq 124 ] && grep -qE '[0-9]+ passed' "$out"; then
            echo "WARN: pytest hung after passing; treating as pass (interpreter shutdown)"
            exit 0
          fi
          exit "$ec"
      - name: Security scan (bandit high)
        run: bandit -q -r server.py internal tests --severity-level high
      - name: Lint report (non-blocking)
        continue-on-error: true
        run: |
          pip install black flake8
          black --check --line-length 88 server.py internal tests
          flake8 server.py internal tests --max-line-length 88 --statistics
      - name: Runtime health check
        run: |
          uvicorn server:app --host 0.0.0.0 --port 8080 &
          sleep 5
          curl --fail http://localhost:8080/health
          curl --fail http://localhost:8080/api/subnets
