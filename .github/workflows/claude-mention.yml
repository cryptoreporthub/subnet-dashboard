name: Claude mention

# Runs Claude when an owner, member or collaborator writes "@claude" in a
# PR or issue comment. The GitHub App reacts to the mention, but this
# workflow does the work. Requires the repo secret ANTHROPIC_API_KEY.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write # Joshua chose: Claude may push fixes (Oct 31)
  pull-requests: write
  issues: write
  id-token: write # required by claude-code-action to get its GitHub token
  actions: read # lets Claude read CI results on PRs

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login != 'claude[bot]' &&
      (
        contains(fromJSON('["simi-revision[bot]","simibot[bot]"]'), github.event.comment.user.login) ||
        (
          github.event.comment.performed_via_github_app == null &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Uses Joshua's Claude subscription (no per-token API billing).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Joshua chose Haiku to save subscription quota (no Opus).
          claude_args: "--model haiku"
          # Only our own two GitHub Apps may tag Claude; claude[bot] is never allowed.
          allowed_bots: simi-revision,simibot
