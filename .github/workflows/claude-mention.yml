name: Claude mention

# Humans (owner, member or collaborator) trigger Claude with "@claude" in a
# PR or issue comment. Bots (cursor[bot], simi-revision[bot], simibot[bot])
# trigger it only when the comment starts with "@claude handoff-review", so a
# quoted "@claude" never starts a run. Bot-triggered runs cannot write
# repository contents; they may post PR and issue comments.
# The GitHub App reacts to the mention, but this workflow does the
# work. Requires the repo secret ANTHROPIC_API_KEY.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# No permissions by default. A job without its own block gets none, instead of
# the repo default (write).
permissions: {}

jobs:
  claude-human:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      !endsWith(github.event.comment.user.login, '[bot]') &&
      github.event.comment.performed_via_github_app == null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write # Joshua chose: Claude may push fixes (Oct 31)
      pull-requests: write
      issues: write
      id-token: write # required by claude-code-action to get its GitHub token
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Uses Joshua's Claude subscription (no per-token API billing).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Joshua chose Haiku to save subscription quota (no Opus).
          claude_args: "--model haiku"

  claude-bot:
    if: >-
      startsWith(github.event.comment.body, '@claude handoff-review') &&
      contains(fromJSON('["simi-revision[bot]","simibot[bot]","cursor[bot]"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Use the job-scoped workflow token, so contents: read limits this run.
          github_token: ${{ github.token }}
          # Uses Joshua's Claude subscription (no per-token API billing).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Joshua chose Haiku to save subscription quota (no Opus).
          claude_args: "--model haiku"
          # simi-revision, simibot, and cursor[bot] (Auto-Review) may tag Claude;
          # claude[bot] is never allowed.
          allowed_bots: simi-revision,simibot,cursor
