# Read-only soul_map compaction dry-run — no --execute, no restart, no deploy.
name: Soul map compaction dry-run
on:
  workflow_dispatch:
jobs:
  dry_run:
    name: compact_soul_map --dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Dry-run via fly ssh (read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          B64="$(base64 -w0 scripts/compact_soul_map.py)"
          # Write to /tmp so --dry-run works without a prior deploy; --path points at live volume.
          # dry_run() does not import write_soul_map / REPO_ROOT.
          flyctl ssh console -a subnet-dashboard -C "bash -lc 'echo $B64 | base64 -d > /tmp/compact_soul_map.py && python3 /tmp/compact_soul_map.py --dry-run --path /app/data/soul_map.json'" | tee "$RUNNER_TEMP/soul-map-compaction-dry-run.txt"
          grep -q 'DRY_RUN_SUCCESS' "$RUNNER_TEMP/soul-map-compaction-dry-run.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soul-map-compaction-dry-run-${{ github.run_id }}
          path: ${{ runner.temp }}/soul-map-compaction-dry-run.txt
