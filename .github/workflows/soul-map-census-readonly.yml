# Read-only soul_map.json census — no volume writes, no restart, no deploy.
name: Soul map census (read-only)
on:
  workflow_dispatch:
jobs:
  census:
    name: soul_map byte census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Census via fly ssh (read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          B64="$(base64 -w0 scripts/soul_map_census_readonly.py)"
          flyctl ssh console -a subnet-dashboard -C "python3 -c \"import base64; exec(base64.b64decode('$B64').decode())\"" | tee "$RUNNER_TEMP/soul-map-census.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: soul-map-census-${{ github.run_id }}
          path: ${{ runner.temp }}/soul-map-census.txt
