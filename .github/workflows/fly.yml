name: Fly Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy-guard:
    name: Deploy Guard
    runs-on: ubuntu-latest
    # PRs are gated by ci-smoke.yml (job: smoke). Re-run contract here before deploy
    # so production never depends on workflow ordering on main.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static guards
        run: |
          set -e
          echo "=== GUARD 1: FastAPI + uvicorn must be declared in requirements.txt ==="
          if ! grep -qi "fastapi" requirements.txt || ! grep -qi "uvicorn" requirements.txt; then
            echo "GUARD FAIL: fastapi/uvicorn missing from requirements.txt"
            exit 1
          fi
          echo "=== GUARD 2: Procfile must start the ASGI app via uvicorn ==="
          if ! grep -qi uvicorn Procfile 2>/dev/null; then
            echo "GUARD FAIL: Procfile must reference uvicorn"
            exit 1
          fi
          echo "=== GUARD 3: single foundation — no stray server/ package or server_original.py ==="
          if [ -d server ] || [ -f server_original.py ]; then
            echo "GUARD FAIL: a second server foundation is present (server/ or server_original.py)"
            exit 1
          fi
          echo "STATIC GUARDS PASSED"
      - name: Endpoint contract guard
        env:
          # Daemon ladder/whale warm threads hang Deploy Guard if a contract
          # hit races a TaoStats/TMC scan — keep CI synchronous-only.
          DISABLE_BACKGROUND_SCANS: "1"
        run: |
          set -e
          echo "=== Enforcing endpoint contract (every route must return non-5xx / 200) ==="
          pip install -r requirements.txt
          pip install pytest httpx
          python -m pytest tests/test_endpoint_contract.py -q
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    needs: deploy-guard
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest  # Must be >= 0.2.71 #
      - name: Ensure data_volume exists (app primary region)
        continue-on-error: true
        run: |
          set -e
          REGION="${FLY_PRIMARY_REGION:-sjc}"
          COUNT=$(flyctl volumes list -a subnet-dashboard --json 2>/dev/null | python3 -c "
          import json,sys,os
          region=os.environ.get('FLY_PRIMARY_REGION','sjc')
          rows=json.load(sys.stdin)
          print(sum(1 for v in rows if v.get('name')=='data_volume' and v.get('region')==region))
          " 2>/dev/null || echo 0)
          if [ "$COUNT" -lt 1 ]; then
            echo "Creating data_volume in $REGION"
            flyctl volumes create data_volume --app subnet-dashboard --region "$REGION" -n 1 --yes
          else
            echo "data_volume already present in $REGION (count=$COUNT)"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_PRIMARY_REGION: sjc
      # Canon = v1 (fly.toml): one web machine, data_volume + inline worker.
      # split_v2 left hero/Telegram/mindmap/learning stuck behind a broken
      # web→worker private hop — do not force v2 from CI anymore.
      - name: Rollback split_v2 → v1 when detected
        run: |
          set -e
          chmod +x scripts/fly_disable_worker_v2.sh scripts/fly_worker_split_v2_guard.sh
          if ./scripts/fly_worker_split_v2_guard.sh; then
            echo "split v2 detected (secret and/or worker machine) — rolling back to v1"
            # Prepare only: unset secrets + free volume; deploy step uses fly.toml.
            FLY_DISABLE_SKIP_DEPLOY=1 FLY_APP=subnet-dashboard FLY_PRIMARY_REGION=sjc \
              ./scripts/fly_disable_worker_v2.sh
          else
            echo "v1 mode — skip rollback"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_PRIMARY_REGION: sjc
      - name: Deploy to Fly (v1 fly.toml, region sjc)
        run: |
          set -e
          FLY_CONFIG=fly.toml
          echo "deploying $FLY_CONFIG (inline worker + volume on web)"
          deploy_once() {
            flyctl deploy --config "$FLY_CONFIG" --remote-only --no-cache --yes --regions sjc --ha=false
          }
          # ponytail: never destroy healthy machines up front — a failed recreate
          # leaves zero candidates and the edge shows a TLS error in browsers.
          for attempt in 1 2 3 4 5; do
            echo "=== flyctl deploy attempt $attempt/5 (regions=sjc) ==="
            if deploy_once; then
              exit 0
            fi
            echo "deploy attempt $attempt failed — waiting 60s before retry"
            sleep 60
          done
          echo "=== deploy still failing — run volume recover then retry ==="
          ./scripts/fly_volume_recover.sh
          for attempt in 1 3; do
            echo "=== post-recover deploy attempt $attempt/3 ==="
            if deploy_once; then
              exit 0
            fi
            echo "post-recover attempt $attempt failed — waiting 90s"
            sleep 90
          done
          echo "GUARD FAIL: flyctl deploy failed after volume recover"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Scale web=1 (no dedicated worker)
        run: |
          flyctl scale count web=1 --app subnet-dashboard --yes
          flyctl scale count worker=0 --app subnet-dashboard --yes || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Reconcile process groups (destroy orphan workers)
        run: |
          chmod +x scripts/fly_web_recover.sh scripts/fly_worker_split_v2_guard.sh
          FLY_APP=subnet-dashboard ./scripts/fly_web_recover.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Clear leftover v2 proxy URL secret
        run: |
          chmod +x scripts/fly_set_worker_internal_url.sh scripts/fly_worker_split_v2_guard.sh
          FLY_APP=subnet-dashboard ./scripts/fly_set_worker_internal_url.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # flyctl treats "stopped" as a good post-deploy state; a started machine
      # with critical checks is also unreachable (proxy: no good candidate).
      # Force start/restart + verify public /health before declaring success.
      - name: Ensure machine is healthy
        run: |
          set -e
          echo "=== Machine status before recover ==="
          flyctl status -a subnet-dashboard || true
          flyctl machines list -a subnet-dashboard || true
          # Prefer leave a healthy machine alone — blind restart after secrets
          # churn was wedging v1 right after learning-loop green.
          code=$(curl -sS -m 10 -o /tmp/health_body -w "%{http_code}" https://subnet-dashboard.fly.dev/health || echo 000)
          body=$(cat /tmp/health_body 2>/dev/null || true)
          echo "precheck health: HTTP $code body=$body"
          if [ "$code" != "200" ]; then
            for id in $(flyctl machines list -a subnet-dashboard --json | python3 -c "
          import json,sys
          for m in json.load(sys.stdin):
              pg = (m.get('process_group') or 'web').lower()
              if pg == 'web' and m.get('id'):
                  print(m.get('id'))
          "); do
              [ -n "$id" ] || continue
              echo "Machine $id unhealthy — restarting"
              flyctl machines restart "$id" -a subnet-dashboard || flyctl machines start "$id" -a subnet-dashboard || true
            done
          else
            echo "Public health already OK — skip restart"
          fi
          echo "=== Machine status after recover ==="
          flyctl machines list -a subnet-dashboard || true
          for i in $(seq 1 36); do
            code=$(curl -sS -m 10 -o /tmp/health_body -w "%{http_code}" https://subnet-dashboard.fly.dev/health || echo 000)
            body=$(cat /tmp/health_body 2>/dev/null || true)
            echo "attempt $i: HTTP $code body=$body"
            if [ "$code" = "200" ]; then
              echo "Public health OK"
              break
            fi
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "=== Recent logs (best effort) ==="
            flyctl logs -a subnet-dashboard --no-tail || true
            echo "GUARD FAIL: public /health did not return 200 within ~3m"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Warm production caches
        run: |
          chmod +x scripts/warm_prod.sh
          APP_BASE_URL=https://subnet-dashboard.fly.dev ./scripts/warm_prod.sh
      - name: Wait for live_subnets cache (lite bootstrap)
        continue-on-error: true
        run: |
          BASE=https://subnet-dashboard.fly.dev
          for i in $(seq 1 48); do
            body=$(curl -fsS -m 15 "$BASE/api/data-freshness" 2>/dev/null || echo '{}')
            echo "$body" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          count=d.get('subnet_count') or 0
          stale=d.get('stale')
          boot=d.get('boot_status') or {}
          phase=boot.get('phase')
          ok=boot.get('ok')
          print(f'live_subnets attempt {sys.argv[1]}: subnet_count={count} stale={stale} boot={phase} ok={ok}')
          warm=count>0 and (stale is False or (phase=='sync_done' and ok is True))
          sys.exit(0 if warm else 1)
          " "$i" && { echo "live_subnets cache warm"; exit 0; }
            sleep 10
          done
          echo "WARN: live_subnets not fresh after ~8m (check worker logs)"
          curl -fsS -m 15 "$BASE/api/data-freshness" | python3 -m json.tool || true
      - name: Learning loop post-deploy check
        continue-on-error: false
        run: |
          set -e
          chmod +x scripts/check_learning_loop.sh
          # Sustained health: 3 spaced probes before learning check
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -m 10 -o /dev/null -w "%{http_code}" https://subnet-dashboard.fly.dev/health || echo 000)
            echo "sustained health $i: HTTP $code"
            [ "$code" = "200" ] && ok=$((ok + 1)) || true
            sleep 5
          done
          if [ "$ok" -lt 2 ]; then
            echo "GUARD FAIL: sustained /health below 2/3"
            exit 1
          fi
          APP_BASE_URL=https://subnet-dashboard.fly.dev ./scripts/check_learning_loop.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
