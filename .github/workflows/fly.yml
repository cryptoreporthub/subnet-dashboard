name: Fly Deploy
on:
  # INCIDENT 2026-08-19: push-to-main disabled until fly.toml + this workflow + contract
  # tests agree on one topology (v2 deploy at 01:59 UTC caused outage + rollback loop).
  # Deploy only via workflow_dispatch after explicit review.
  workflow_dispatch:
jobs:
  deploy-guard:
    name: Deploy Guard
    runs-on: ubuntu-latest
    # PRs are gated by ci-smoke.yml (job: smoke). Re-run contract here before deploy
    # so production never depends on workflow ordering on main.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static guards
        run: |
          set -e
          echo "=== GUARD 1: FastAPI + uvicorn must be declared in requirements.txt ==="
          if ! grep -qi "fastapi" requirements.txt || ! grep -qi "uvicorn" requirements.txt; then
            echo "GUARD FAIL: fastapi/uvicorn missing from requirements.txt"
            exit 1
          fi
          echo "=== GUARD 2: Procfile must start the ASGI app via uvicorn ==="
          if ! grep -qi uvicorn Procfile 2>/dev/null; then
            echo "GUARD FAIL: Procfile must reference uvicorn"
            exit 1
          fi
          echo "=== GUARD 3: single foundation — no stray server/ package or server_original.py ==="
          if [ -d server ] || [ -f server_original.py ]; then
            echo "GUARD FAIL: a second server foundation is present (server/ or server_original.py)"
            exit 1
          fi
          echo "STATIC GUARDS PASSED"
      - name: Endpoint contract guard
        env:
          # Daemon ladder/whale warm threads hang Deploy Guard if a contract
          # hit races a TaoStats/TMC scan — keep CI synchronous-only.
          DISABLE_BACKGROUND_SCANS: "1"
        run: |
          set -e
          echo "=== Enforcing endpoint contract (every route must return non-5xx / 200) ==="
          pip install -r requirements.txt
          pip install pytest httpx
          python -m pytest tests/test_endpoint_contract.py tests/test_fly_telegram_worker_config.py -q
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    needs: deploy-guard
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest  # Must be >= 0.2.71 #
      - name: Ensure data_volume exists (app primary region)
        continue-on-error: true
        run: |
          set -e
          REGION="${FLY_PRIMARY_REGION:-sjc}"
          COUNT=$(flyctl volumes list -a subnet-dashboard --json 2>/dev/null | python3 -c "
          import json,sys,os
          region=os.environ.get('FLY_PRIMARY_REGION','sjc')
          rows=json.load(sys.stdin)
          print(sum(1 for v in rows if v.get('name')=='data_volume' and v.get('region')==region))
          " 2>/dev/null || echo 0)
          if [ "$COUNT" -lt 1 ]; then
            echo "Creating data_volume in $REGION"
            flyctl volumes create data_volume --app subnet-dashboard --region "$REGION" -n 1 --yes
          else
            echo "data_volume already present in $REGION (count=$COUNT)"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_PRIMARY_REGION: sjc
      # Canon = v1 inline (fly.toml): one web machine + inline worker subprocess; volume on web.
      - name: Clear v2 secrets if present
        run: |
          flyctl secrets unset WORKER_SPLIT_V2 --app subnet-dashboard 2>/dev/null || true
          flyctl secrets unset WORKER_INTERNAL_URL --app subnet-dashboard 2>/dev/null || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy to Fly (v1 inline fly.toml, region sjc)
        run: |
          set -e
          echo "deploying fly.toml (v1 inline worker, volume on web)"
          flyctl deploy --config fly.toml --remote-only --no-cache --yes --regions sjc --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Scale web=1 worker=0 (v1 inline)
        run: |
          flyctl scale count web=1 --app subnet-dashboard --yes
          flyctl scale count worker=0 --app subnet-dashboard --yes 2>/dev/null || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify Fly process topology (web=1, no dedicated worker)
        run: |
          set -e
          flyctl machines list -a subnet-dashboard --json | python3 -c "
          import json, sys

          machines = json.load(sys.stdin)
          counts = {'web': 0, 'worker': 0}
          for m in machines:
              meta = (m.get('config') or {}).get('metadata') or {}
              pg = (
                  meta.get('fly_process_group')
                  or meta.get('process_group')
                  or m.get('process_group')
                  or 'web'
              ).lower()
              if pg in counts:
                  counts[pg] += 1
          print('process_groups:', counts)
          if counts['web'] < 1:
              print('GUARD FAIL: expected web>=1 after v1 deploy')
              sys.exit(1)
          if counts['worker'] > 0:
              print('GUARD FAIL: v1 deploy must not keep dedicated worker machines')
              sys.exit(1)
          "
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify v1 inline readiness
        run: |
          set -e
          curl -fsS -m 30 https://subnet-dashboard.fly.dev/api/ops/readiness | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          mode = d.get('worker_mode')
          peer = d.get('worker_peer') or {}
          print('worker_mode=', mode)
          print('worker_peer=', peer)
          if mode == 'split_v2':
              print('GUARD FAIL: still reporting split_v2 after v1 deploy')
              sys.exit(1)
          if not peer.get('alive'):
              print('GUARD FAIL: inline worker not alive in readiness')
              sys.exit(1)
          "
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # flyctl treats "stopped" as a good post-deploy state; a started machine
      # with critical checks is also unreachable (proxy: no good candidate).
      # Force start/restart + verify public /health before declaring success.
      - name: Ensure machine is healthy
        run: |
          set -e
          echo "=== Machine status before recover ==="
          flyctl status -a subnet-dashboard || true
          flyctl machines list -a subnet-dashboard || true
          # Wait-and-probe ONLY: the app is confirmed serving /pump 200.
          # /health chronically 422s at the edge, so do NOT restart a machine
          # that is already up (a blind restart just forces a long reboot and
          # the gate times out during it). Leave the machine alone and probe until
          # /health=200 OR /pump=200 (render proves the server is genuinely up).
          echo "=== Machine status after recover ==="
          flyctl machines list -a subnet-dashboard || true
          for i in $(seq 1 36); do
            code=$(curl -sS -m 10 -o /tmp/health_body -w "%{http_code}" https://subnet-dashboard.fly.dev/health || echo 000)
            body=$(cat /tmp/health_body 2>/dev/null || true)
            echo "attempt $i: HTTP $code body=$body"
            if [ "$code" = "200" ]; then
              echo "Public health OK"
              break
            fi
            # Known edge condition: /health can 422 at the edge (load-shed/shared gate)
            # while the app is actually up and serving SSR paths 200 through the SAME edge.
            # Distinguish edge-noise from a truly dead server: if the machine renders /pump
            # 200, treat it healthy so the deploy proceeds and warm/learning steps run.
            page=$(curl -sS -m 10 -o /dev/null -w "%{http_code}" https://subnet-dashboard.fly.dev/pump || echo 000)
            echo "attempt $i: render /pump HTTP $page"
            if [ "$code" != "000" ] && [ "$page" = "200" ]; then
              echo "Machine is UP (renders 200); /health=$code is edge/gate noise - proceeding"
              code=200
              break
            fi
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "=== Recent logs (best effort) ==="
            flyctl logs -a subnet-dashboard --no-tail || true
            echo "GUARD FAIL: server not healthy (health 200 or render /pump 200) within ~3m"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Warm production caches
        run: |
          chmod +x scripts/warm_prod.sh
          APP_BASE_URL=https://subnet-dashboard.fly.dev ./scripts/warm_prod.sh
      - name: Wait for live_subnets cache (lite bootstrap)
        continue-on-error: true
        run: |
          BASE=https://subnet-dashboard.fly.dev
          for i in $(seq 1 48); do
            body=$(curl -fsS -m 15 "$BASE/api/data-freshness" 2>/dev/null || echo '{}')
            echo "$body" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          count=d.get('subnet_count') or 0
          stale=d.get('stale')
          boot=d.get('boot_status') or {}
          phase=boot.get('phase')
          ok=boot.get('ok')
          print(f'live_subnets attempt {sys.argv[1]}: subnet_count={count} stale={stale} boot={phase} ok={ok}')
          warm=count>0 and (stale is False or (phase=='sync_done' and ok is True))
          sys.exit(0 if warm else 1)
          " "$i" && { echo "live_subnets cache warm"; exit 0; }
            sleep 10
          done
          echo "WARN: live_subnets not fresh after ~8m (check worker logs)"
          curl -fsS -m 15 "$BASE/api/data-freshness" | python3 -m json.tool || true
      - name: Learning loop post-deploy check
        continue-on-error: false
        run: |
          set -e
          chmod +x scripts/check_learning_loop.sh
          # Sustained health: 3 spaced probes before learning check
          ok=0
          for i in 1 2 3; do
            code=$(curl -sS -m 10 -o /dev/null -w "%{http_code}" https://subnet-dashboard.fly.dev/health || echo 000)
            echo "sustained health $i: HTTP $code"
            [ "$code" = "200" ] && ok=$((ok + 1)) || true
            sleep 5
          done
          if [ "$ok" -lt 2 ]; then
            echo "GUARD FAIL: sustained /health below 2/3"
            exit 1
          fi
          APP_BASE_URL=https://subnet-dashboard.fly.dev ./scripts/check_learning_loop.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

