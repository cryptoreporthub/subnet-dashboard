name: Disable Worker Split v2 (rollback to v1)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type disable to roll prod back to v1 inline worker"
        required: true
        default: ""

jobs:
  disable-v2:
    name: Disable worker split v2
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'disable'
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Run v1 rollback
        run: |
          chmod +x scripts/fly_disable_worker_v2.sh scripts/fly_worker_split_v2_guard.sh
          ./scripts/fly_disable_worker_v2.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_PRIMARY_REGION: sjc
      - name: Learning loop check
        run: |
          chmod +x scripts/check_learning_loop.sh
          APP_BASE_URL=https://subnet-dashboard.fly.dev ./scripts/check_learning_loop.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
