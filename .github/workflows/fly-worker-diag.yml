name: Fly worker diag

on:
  workflow_dispatch:  # manual trigger
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    name: Worker logs + live_subnets probe (split v2 worker, v1 web fallback)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'cryptoreporthub' && (github.event.label.name == 'fly-deploy' || github.event.label.name == 'fly-diag'))
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Machine status
        run: |
          flyctl status -a subnet-dashboard || true
          flyctl machines list -a subnet-dashboard || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Recent worker logs (live_subnets + telegram + boot)
        run: |
          flyctl logs -a subnet-dashboard --no-tail 2>&1 \
            | grep -E -i "live_subnets|telegram|Monitoring group|Could not find group|get_entity|ResolveUsername|entity_resolve|Connected to Telegram|background_boot|resolver_scheduler|start_prediction_resolver|bootstrap_live_subnets|boot_status|worker_heartbeat|chain_client|sync_start|sync_done" \
            | tail -200 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Exec worker probe (split v2: worker machine; v1: web machine)
        run: bash scripts/worker-diag.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Worker /jobs inventory (FP7)
        id: jobs
        run: |
          set +e
          bash scripts/probe_worker_jobs.sh > /tmp/jobs.out 2>&1
          rc=$?
          cat /tmp/jobs.out
          echo 'PROBE_RC='$rc | tee -a /tmp/jobs.out
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Post /jobs inventory to PR (label-triggered run)
        if: github.event_name == 'pull_request'
        run: |
          { echo '**FP7 /jobs inventory**'; echo '```'; cat /tmp/jobs.out; echo '```'; } > /tmp/jobs_body.txt
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/jobs_body.txt || echo 'comment failed (non-fatal)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Public data-freshness
        run: curl -fsS https://subnet-dashboard.fly.dev/api/data-freshness | python3 -m json.tool
