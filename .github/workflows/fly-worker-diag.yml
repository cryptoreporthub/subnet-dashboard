name: Fly worker diag

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    name: worker diag probe
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'fly-diag') }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Worker /jobs inventory
        run: |
          set +e
          bash scripts/probe_worker_jobs.sh > /tmp/jobs.out 2>&1
          rc=$?
          cat /tmp/jobs.out
          echo 'probe_rc='$rc | tee -a /tmp/jobs.out
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Post /jobs to PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          { echo '**FP7 /jobs inventory**'; echo '```'; cat /tmp/jobs.out; echo '```'; } > /tmp/body.txt
          gh pr comment $PR_NUMBER --repo $GITHUB_REPOSITORY --body-file /tmp/body.txt || echo 'comment failed (non-fatal)'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
