name: Worker Diag v2

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Machine status
        run: |
          echo '== APP STATUS =='
          flyctl status -a subnet-dashboard || true
          echo '== MACHINES =='
          flyctl machines list -a subnet-dashboard || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Worker logs
        run: |
          flyctl logs -a subnet-dashboard --no-tail 2>&1 \
            | rg -i 'live_subnets|telegram|entity_resolve|Connected to Telegram|Monitoring group' \
            | tail -120 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Public data-freshness
        run: curl -fsS https://subnet-dashboard.fly.dev/api/data-freshness | python3 -m json.tool
