name: Reset Live Dispatcher

on:
  pull_request:
    types: [labeled]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-live-reset:
    name: Dispatch live reset (human-confirmed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: message-intel-reset
      cancel-in-progress: false
    steps:
      - name: Guard: actor, repo, merged, docs-only vehicle, confirm + mode in body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.label.name }}" != "run-reset-live" ]; then
            echo "Not the run-reset-live label; ignoring."
            exit 78
          fi
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Fork PRs cannot dispatch live resets"
            exit 1
          fi
          if [ "${{ github.actor }}" != "cryptoreporthub" ]; then
            echo "::error::Only actor cryptoreporthub may dispatch live resets"
            exit 1
          fi
          if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "::error::Label a MERGED docs-only vehicle PR"
            exit 1
          fi
          mapfile -t files < <(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename')
          bad=()
          for f in "${files[@]}"; do
            case "$f" in
              docs/deploy-vehicles/*) ;;
              *) bad+=("$f") ;;
            esac
          done
          if [ "${#bad[@]}" -gt 0 ]; then
            echo "::error::Not a docs-only vehicle PR; refusing"
            printf '%s\n' "${bad[@]}"
            exit 1
          fi
          body="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" -q .body)"
          if ! printf '%s\n' "$body" | grep -qx "confirm: RESET_TO_ZERO"; then
            echo "::error::PR body must contain the exact line 'confirm: RESET_TO_ZERO' (human confirmation). Edit the PR body, then re-add the label."
            exit 1
          fi
          MODE="$(printf '%s\n' "$body" | grep -x "mode: \(full\|keep-week\)" | sed 's/^mode: //')"
          if [ -z "$MODE" ]; then
            echo "::error::PR body must contain the exact line 'mode: full' or 'mode: keep-week'"
            exit 1
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "Guards passed; mode=$MODE"
      - name: Dispatch live reset workflow (all internal gates still apply)
        run: |
          set -euo pipefail
          gh workflow run fly-reset-message-intel.yml --ref main \
            -f dry_run=false -f confirm=RESET_TO_ZERO -f mode="$MODE"
          echo "Dispatched live reset (mode=$MODE). All internal gates (quiescence, prod-version==main, confirm) still enforce."
