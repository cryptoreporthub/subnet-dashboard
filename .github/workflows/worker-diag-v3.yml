name: Worker Diag v3

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Live subnets probe (exec into web machine)
        run: |
          set -e
          MACHINE_ID="$(flyctl machines list -a subnet-dashboard --json | python3 -c "
          import json, sys
          for m in json.load(sys.stdin):
              if m.get('id'):
                  print(m['id'])
                  break
          ")"
          echo "machine=$MACHINE_ID"
          flyctl machine exec "$MACHINE_ID" "cd /app && python3 -c \"
import json, os, time
from internal.live_subnets import _cache_path, live_data_freshness, _sync_once
print('RUN_MODE=', os.environ.get('RUN_MODE'))
print('FETCH_MODE=', os.environ.get('LIVE_SUBNETS_FETCH_MODE'))
print('cache_path=', _cache_path())
print('cache_exists=', os.path.isfile(_cache_path()))
fresh = live_data_freshness()
print('freshness=', json.dumps({k: fresh.get(k) for k in ('subnet_count','last_sync','stale','boot_status','rpc_healthy')}))
t0=time.time()
ok = _sync_once()
print('sync_once=', ok, 'sec=', round(time.time()-t0,1))
\""" --app subnet-dashboard --timeout 300 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Recent web logs (live_subnets+telegram)
        run: |
          flyctl logs -a subnet-dashboard --no-tail 2>&1 \
            | grep -iE 'live_subnets|telegram|entity_resolve|Connected to Telegram|Monitoring group|ResolveUsername' \
            | tail -120 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Public data-freshness
        run: curl -fsS https://subnet-dashboard.fly.dev/api/data-freshness | python3 -m json.tool
