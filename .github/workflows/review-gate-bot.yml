name: review-gate-bot

# Gate for the review-gate bot only. It runs no model, reads no secret and
# posts nothing: the unit tests, the type check and `agent-sdk validate`.
# Evals need a Cursor credential and are run by hand (review-gate-bot/README.md).

on:
  pull_request:
    paths:
      - "review-gate-bot/**"
      - ".github/workflows/review-gate-bot.yml"
  push:
    paths:
      - "review-gate-bot/**"
      - ".github/workflows/review-gate-bot.yml"

permissions:
  contents: read

concurrency:
  group: review-gate-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: review-gate-bot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: review-gate-bot/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Validate the agent
        run: npm run validate
