name: Worker Diag v1

on:
  workflow_dispatch:  # manual trigger

jobs:
  diag:
    name: Worker logs + live_subnets probe (v1 inline worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Machine status
        run: |
          flyctl status -a subnet-dashboard || true
          flyctl machines list -a subnet-dashboard || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Recent worker logs (live_subnets + telegram + boot)
        run: |
          flyctl logs -a subnet-dashboard --no-tail 2>&1 \
            | grep -E -i "live_subnets|telegram|Monitoring group|Could not find group|get_entity|ResolveUsername|entity_resolve|Connected to Telegram|background_boot|resolver_scheduler|start_prediction_resolver|bootstrap_live_subnets|boot_status|worker_heartbeat|chain_client|sync_start|sync_done" \
            | tail -200 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: "Exec inline-worker probe (v1: on the web machine)"
        run: |
          set -e
          # list states of all web machines (diagnostic)
          flyctl machines list -a subnet-dashboard --json | jq -r '.[] | "(.id) state=(.state) pg=(.process_group // .config.process_group // "web")"' || true
          TARGET_ID="$(flyctl machines list -a subnet-dashboard --json | jq -r '[.[] | select(((.process_group // .config.process_group // "web") == "web") and .state == "running")][0].id // empty')"
          if [ -z "$TARGET_ID" ] || [ "$TARGET_ID" = "null" ]; then
            TARGET_ID="$(flyctl machines list -a subnet-dashboard --json | jq -r '[.[] | select((.process_group // .config.process_group // "web") == "web")][0].id // empty')"
          fi
          if [ -z "$TARGET_ID" ] || [ "$TARGET_ID" = "null" ]; then
            TARGET_ID="$(flyctl machines list -a subnet-dashboard --json | jq -r '.[0].id')"
          fi
          echo "probe machine=$TARGET_ID"
          STATE="$(flyctl machine status "$TARGET_ID" -a subnet-dashboard --json 2>/dev/null | jq -r '.state // empty')"
          echo "machine state=$STATE"
          if [ "$STATE" != "running" ] && [ "$STATE" != "started" ] && [ -n "$STATE" ]; then
            echo "machine not running (state=$STATE); starting..."
            flyctl machine start "$TARGET_ID" --app subnet-dashboard || true
            sleep 20
          fi
          PROBE_B64=""
          echo "started=$STARTED"
          flyctl machine exec "$TARGET_ID" "cd /app && echo \"$PROBE_B64\" | base64 -d > /tmp/probe.py && python3 /tmp/probe.py" --app subnet-dashboard --timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Exec Telegram entity probe (web machine)
        run: |
          set -e
          # list states of all web machines (diagnostic)
          flyctl machines list -a subnet-dashboard --json | jq -r '.[] | "(.id) state=(.state) pg=(.process_group // .config.process_group // "web")"' || true
          TARGET_ID="$(flyctl machines list -a subnet-dashboard --json | jq -r '[.[] | select(((.process_group // .config.process_group // "web") == "web") and .state == "running")][0].id // empty')"
          if [ -z "$TARGET_ID" ] || [ "$TARGET_ID" = "null" ]; then
            TARGET_ID="$(flyctl machines list -a subnet-dashboard --json | jq -r '[.[] | select((.process_group // .config.process_group // "web") == "web")][0].id // empty')"
          fi
          if [ -z "$TARGET_ID" ] || [ "$TARGET_ID" = "null" ]; then
            TARGET_ID="$(flyctl machines list -a subnet-dashboard --json | jq -r '.[0].id')"
          fi
          echo "probe machine=$TARGET_ID"
          STATE="$(flyctl machine status "$TARGET_ID" -a subnet-dashboard --json 2>/dev/null | jq -r '.state // empty')"
          echo "machine state=$STATE"
          if [ "$STATE" != "running" ] && [ "$STATE" != "started" ] && [ -n "$STATE" ]; then
            echo "machine not running (state=$STATE); starting..."
            flyctl machine start "$TARGET_ID" --app subnet-dashboard || true
            sleep 20
          fi
          flyctl machine exec "$TARGET_ID" "cd /app && python3 scripts/probe_telegram_entity.py" --app subnet-dashboard --timeout 120 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Public data-freshness
        run: curl -fsS https://subnet-dashboard.fly.dev/api/data-freshness | python3 -m json.tool
