name: Worker Diag v1

on:
  workflow_dispatch:  # manual trigger

jobs:
  diag:
    name: Worker logs + live_subnets probe (v1 inline worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Machine status
        run: |
          flyctl status -a subnet-dashboard || true
          flyctl machines list -a subnet-dashboard || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Recent worker logs
        run: |
          flyctl logs -a subnet-dashboard --no-tail 2>&1 | grep -E -i "live_subnets|telegram|bootstrap_live_subnets|boot_status|worker_heartbeat|sync_start|sync_done" | tail -200 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Worker probe (machine select + exec)
        run: bash scripts/worker-diag.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Public data-freshness
        run: curl -fsS https://subnet-dashboard.fly.dev/api/data-freshness | python3 -m json.tool
