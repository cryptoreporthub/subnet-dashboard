name: Worker Diag v4

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      - name: Readiness report (effective feed + issues)
        run: |
          echo '== /api/ops/readiness =='
          curl -fsS https://subnet-dashboard.fly.dev/api/ops/readiness | python3 -m json.tool || true
        
      - name: Public data-freshness
        run: |
          echo '== /api/data-freshness =='
          curl -fsS https://subnet-dashboard.fly.dev/api/data-freshness | python3 -m json.tool || true
        
      - name: Machine status
        run: |
          flyctl machines list -a subnet-dashboard || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Worker/telegram logs
        run: |
          flyctl logs -a subnet-dashboard --no-tail 2>&1 \
            | grep -iE 'live_subnets|essential mode|telegram|entity_resolve|Connected to Telegram|Monitoring group|ResolveUsername|worker' \
            | tail -150 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
