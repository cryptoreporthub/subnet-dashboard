name: Set Telegram Secrets

on:
  workflow_dispatch:
    inputs:
      api_id:
        description: 'Telegram API ID'
        required: true
        type: string
      api_hash:
        description: 'Telegram API hash'
        required: true
        type: string
      phone:
        description: 'Telegram phone (e.g. +17025039331)'
        required: true
        type: string
      session_string:
        description: 'Telethon session string (leave blank to skip)'
        required: false
        type: string
      listener:
        description: 'MESSAGE_INTEL_LISTENER value'
        required: false
        default: 'auto'
        type: string
      app:
        description: 'Fly app name'
        required: false
        default: 'subnet-dashboard'
        type: string

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Set Telegram secrets
        env:
          FLY_API_TOKEN: ${ secrets.FLY_API_TOKEN }
          APP: ${ github.event.inputs.app }
          API_ID: ${ github.event.inputs.api_id }
          API_HASH: ${ github.event.inputs.api_hash }
          PHONE: ${ github.event.inputs.phone }
          SESSION: ${ github.event.inputs.session_string }
          LISTENER: ${ github.event.inputs.listener }
        run: |
          set -euo pipefail

          echo "Setting: TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_PHONE MESSAGE_INTEL_LISTENER"
          flyctl secrets set \
            TELEGRAM_API_ID="$API_ID" \
            TELEGRAM_API_HASH="$API_HASH" \
            TELEGRAM_PHONE="$PHONE" \
            MESSAGE_INTEL_LISTENER="$LISTENER" \
            --app "$APP"

          if [ -n "${SESSION}" ]; then
            echo "Setting: TELEGRAM_SESSION_STRING"
            flyctl secrets set TELEGRAM_SESSION_STRING="$SESSION" --app "$APP"
          else
            echo "session_string empty - skipping TELEGRAM_SESSION_STRING"
          fi
