# Patch D Phase 1 — read-only Fly log capture + correlation (no deploy/restart).
# workflow_dispatch or PR label `patchd-capture` (same-repo, cryptoreporthub).
name: Patch D capture (read-only)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Stream live logs for N minutes (0 = retro buffer only via --no-tail)"
        required: false
        default: "90"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  capture:
    name: Patch D log capture + correlate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.label.name == 'patchd-capture' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor == 'cryptoreporthub') }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Volume stat snapshot (pre-capture)
        run: |
          set -euo pipefail
          OUT_DIR="logs"
          OUT_FILE="$OUT_DIR/volume-stat-before.txt"
          ERR_FILE="$OUT_DIR/volume-stat-before.err"
          mkdir -p "$OUT_DIR"
          if ! curl --fail --silent --show-error --max-time 15 \
            "https://subnet-dashboard.fly.dev/api/ops/volume-stat" \
            > "$OUT_FILE" 2> "$ERR_FILE"; then
            {
              echo "STAT_FAIL: curl /api/ops/volume-stat failed"
              cat "$ERR_FILE"
            } > "$OUT_FILE"
          fi
          cat "$OUT_FILE"

      - name: Read-only flyctl log capture
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MINUTES: ${{ inputs.minutes || '90' }}
        run: |
          set -euo pipefail
          APP=subnet-dashboard
          OUT_DIR="logs"
          mkdir -p "$OUT_DIR"
          RAW="$OUT_DIR/raw.log"
          MODE="retro-buffer"

          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "PATCHD_CAPTURE_FAIL: FLY_API_TOKEN secret missing" >&2
            exit 2
          fi

          flyctl status -a "$APP" > "$OUT_DIR/fly-status.txt" 2>&1

          if [ "${MINUTES}" != "0" ] && [ "${MINUTES}" -gt 0 ]; then
            MODE="live-stream-${MINUTES}m"
            echo "capture_mode=${MODE}" > "$OUT_DIR/capture-meta.txt"
            echo "Streaming flyctl logs for ${MINUTES} minutes (read-only)..." | tee -a "$OUT_DIR/capture-meta.txt"
            timeout "$((MINUTES * 60))s" flyctl logs -a "$APP" > "$RAW" 2>&1 || true
          else
            MODE="retro-buffer"
            echo "capture_mode=${MODE}" > "$OUT_DIR/capture-meta.txt"
            echo "Fetching retroactive flyctl logs (--no-tail)..." | tee -a "$OUT_DIR/capture-meta.txt"
            flyctl logs -a "$APP" --no-tail > "$RAW" 2>&1 || true
          fi

          echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$OUT_DIR/capture-meta.txt"
          echo "line_count=$(wc -l < "$RAW" | tr -d ' ')" >> "$OUT_DIR/capture-meta.txt"

          if [ ! -s "$RAW" ]; then
            echo "PATCHD_CAPTURE_FAIL: empty or missing log stream" >&2
            exit 2
          fi
          if grep -qiE 'failed to authenticate|401 Unauthorized|not authorized' "$RAW"; then
            echo "PATCHD_CAPTURE_FAIL: flyctl auth error in log output" >&2
            exit 2
          fi

          python3 scripts/patchd_correlate.py "$RAW" -o "$OUT_DIR/correlated.md" --capture-mode "$MODE"

      - name: Volume stat snapshot (post-capture)
        run: |
          set -euo pipefail
          OUT_DIR="logs"
          OUT_FILE="$OUT_DIR/volume-stat-after.txt"
          ERR_FILE="$OUT_DIR/volume-stat-after.err"
          mkdir -p "$OUT_DIR"
          if ! curl --fail --silent --show-error --max-time 15 \
            "https://subnet-dashboard.fly.dev/api/ops/volume-stat" \
            > "$OUT_FILE" 2> "$ERR_FILE"; then
            {
              echo "STAT_FAIL: curl /api/ops/volume-stat failed"
              cat "$ERR_FILE"
            } > "$OUT_FILE"
          fi
          cat "$OUT_FILE"

      - name: Gate verdict marker (A4.6 completeness)
        if: always()
        run: |
          set -euo pipefail
          echo "## logs/ on runner" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la logs/ | tee -a "$GITHUB_STEP_SUMMARY" || true

          missing=0
          reason=""
          if [ ! -s logs/raw.log ]; then
            missing=1
            reason="${reason} missing-or-empty: raw.log;"
          fi
          if [ ! -s logs/correlated.md ]; then
            missing=1
            reason="${reason} missing-or-empty: correlated.md;"
          fi
          if [ ! -s logs/volume-stat-before.txt ]; then
            missing=1
            reason="${reason} missing-or-empty: volume-stat-before.txt;"
          fi
          if [ ! -s logs/volume-stat-after.txt ]; then
            missing=1
            reason="${reason} missing-or-empty: volume-stat-after.txt;"
          fi
          if grep -q "STAT_FAIL" logs/volume-stat-before.txt logs/volume-stat-after.txt 2>/dev/null; then
            missing=1
            reason="${reason} STAT_FAIL in volume-stat;"
          fi

          if [ "$missing" -ne 0 ]; then
            {
              echo "## PATCH D: UNVERIFIABLE"
              echo ""
              echo "Artifact-completeness gate failed: ${reason}"
              echo "Do not render PASS / SCHEDULED-WRITER / LEAK. Missing expected artifacts stay UNVERIFIABLE."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Artifact completeness captured for A4.6 (raw.log, correlated.md, both volume-stat files)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Loud zero-hit summary (valid outcome)
        if: success()
        run: |
          if grep -q "## ZERO HITS" logs/correlated.md; then
            {
              echo "## PATCH D: ZERO HITS"
              echo ""
              echo "No anchor patterns matched. Extend capture window or arm Phase 2 instrumentation."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "pattern_hits present — see logs/correlated.md artifact" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Patch D artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchd-capture-${{ github.run_id }}
          include-hidden-files: true
          path: |
            logs/raw.log
            logs/correlated.md
            logs/volume-stat-before.txt
            logs/volume-stat-after.txt
            logs/volume-stat-before.err
            logs/volume-stat-after.err
            logs/fly-status.txt
            logs/capture-meta.txt
          if-no-files-found: error
          retention-days: 7
