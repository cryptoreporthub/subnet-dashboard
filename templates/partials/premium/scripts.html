<script>
(function (g) {
  if (g.apiFetchJson) return;
  g.apiFetchJson = function fetchJson(url, ms) {
    ms = ms == null ? 12000 : ms;
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(url, { headers: { Accept: 'application/json' }, signal: ctrl.signal })
      .then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .catch(function (err) {
        clearTimeout(timer);
        throw err;
      });
  };
  g.PUBLISH_GATE_LABEL = {{ publish_gate_label()|default('audit gate')|tojson|safe }};
})(window);
</script>
