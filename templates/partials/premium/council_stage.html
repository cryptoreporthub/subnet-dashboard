{# ============================================================
   Council Hero — Tribunal Design (Agreed & Locked)
   ============================================================ #}
<section class="council-stage home-job" id="section-daily-pick" aria-labelledby="council-stage-title" data-home-live="1">
  <div class="council-stage__atmosphere" aria-hidden="true"></div>
  <div class="council-stage__inner">
    <div id="council-stage-body" class="council-stage__body home-job__body">
      <div id="home-daily-call" class="home-job__call-host" aria-live="polite">
        <div
          class="k3-dossier"
          id="k3-dossier"
          data-testid="council-hero"
        >
          <div class="k3-layer open" id="k3-layer-claim">
            {% include "partials/premium/tribunal_hero.html" %}
          </div>
        </div>
      </div>

      {# ---- CTA actions ---- #}
      <div class="home-job__cta" role="group" aria-label="Primary actions" style="margin-top: 16px;">
        <button
          type="button"
          class="home-cta home-cta--primary"
          id="habit-pin-btn"
        >Pin to watchlist</button>
        <a class="home-cta home-cta--ghost" href="#section-proof-band">View proof</a>
      </div>
    </div>
  </div>
</section>
