
<!DOCTYPE html>
<html lang="en">
<head>
    <script>performance.mark('html-parse')</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SimiVision — Council</title>
    <meta name="description" content="Bittensor subnet council dashboard — picks, paper portfolio, and SimiVision intelligence.">
    {% if public_base_url is defined and public_base_url %}
    <link rel="canonical" href="{{ public_base_url }}/">
    <meta property="og:url" content="{{ public_base_url }}/">
    <meta property="og:title" content="SimiVision — Council">
    <meta property="og:description" content="Subnet council picks, accountability, and live intelligence.">
    <meta property="og:image" content="{{ public_base_url }}/static/og-share.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ public_base_url }}/static/og-share.png">
    {% endif %}
    <meta name="theme-color" content="#2d323a">
    <style>
      /* Critical paint — visible before /static CSS on cold Fly mobile loads */
      html, body { margin: 0; min-height: 100%; background: #080911; color: #f5f7fa; }
    </style>
    <!-- Hydration preload (perf 2026-08-11): start the heaviest fetch-based
         above-fold request during HTML parse. The whale-flow card uses a legacy
         XHR transport, so it intentionally is not preloaded here. -->
    <link rel="preload" as="fetch" href="/api/pump-alerts" crossorigin="use-credentials" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- Fonts: async (preload-as-style) so text can render in fallback font; FOUT swap.
         Falls back to a plain blocking stylesheet when JS is off. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/smoke-tokens.css?v={{ static_v }}">
    <link rel="stylesheet" href="/static/css/base.css?v={{ static_v }}">
    <link rel="stylesheet" href="/static/css/ui.css?v={{ static_v }}">
    <link rel="stylesheet" href="/static/css/tribunal-hero-layout.css?v={{ static_v }}">
    <link rel="stylesheet" href="/static/css/council-polish.css?v={{ static_v }}">
    <!-- Non-critical CSS — async load so they never block first paint -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css"></noscript>
    <link rel="stylesheet" href="/static/css/chat.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/static/css/chat.css"></noscript>
    <link rel="stylesheet" href="/static/vendor/uplot/uPlot.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="/static/vendor/uplot/uPlot.min.css"></noscript>
</head>
<body class="council-first-theme">
    <div class="cosmic-sky" aria-hidden="true"><span class="cosmic-sky__nebula"></span></div>
    {% block content %}{% endblock %}
    <p class="site-nfa" style="margin:12px auto 0;max-width:960px;padding:0 16px 8px;font-size:11px;line-height:1.4;color:#7a9186;text-align:center;">
      SimiVision calls are scored council output, not financial advice. Do your own research.
    </p>
    <script src="/static/js/app.js" defer></script>
    <script src="/static/js/chat_stream.js" defer></script>
    <script src="/static/judge_panel.js" defer></script>
    <script src="/static/js/command_palette.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js" defer></script>
    <script src="/static/js/onboarding_tour.js" defer></script>
    <script src="/static/js/council_polish.js" defer></script>
</body>
</html>
