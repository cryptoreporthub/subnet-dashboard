# Stage 2 hop-proof overlay — v2 kit worker [[services]] on :8081 WITHOUT volume.
# Use ONLY for Stage 2 temp worker deploy (web stays v1 + inline on data_volume).
# Canon routing config lives in fly.worker-v2.toml; this file drops [mounts] so
# prod volume stays on web during hop proof.
#
# STAGE2_HOP=1 skips background schedulers on the temp worker (Fly app secrets
# would otherwise override TELEGRAM_* / MESSAGE_INTEL off). Networking block is
# byte-identical to fly.worker-v2.toml [[services]].
#
# Deploy: scripts/fly_stage2_temp_worker.sh

app = "subnet-dashboard"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[processes]
  worker = "sh ./scripts/fly_worker_entrypoint.sh"

[env]
  RUN_MODE = "worker"
  STAGE2_HOP = "1"
  BACKGROUND_ON_WEB = "off"
  INLINE_WORKER = "0"
  ENABLE_INLINE_WORKER = "0"
  WORKER_SPLIT_V2 = "off"
  WORKER_HEAVY = "off"
  MESSAGE_INTEL_LISTENER = "off"
  TELEGRAM_SUMMARY_BOT = "off"
  WORKER_HTTP_PORT = "8081"
  BOOT_DEFER_SECONDS = "45"
  ENABLE_METRICS = "1"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
  processes = ["worker"]

# Same [[services]] block as fly.worker-v2.toml — representative flycast routing.
[[services]]
  protocol = "tcp"
  internal_port = 8081
  processes = ["worker"]
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8081
    handlers = ["http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
