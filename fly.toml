# fly.toml app configuration file generated for subnet-dashboard
# v1 production topology: web + inline worker on one machine and one persistent volume.

app = "subnet-dashboard"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "sh ./scripts/fly_web_entrypoint.sh"
  # v1: do not declare a dedicated Fly worker process group here.
  # flyctl deploy would spawn a second machine (volume split-brain).
  # Stage 2+ uses fly.worker-v2.toml only after explicit human approve.

[http_service]
  internal_port = 8080
  force_https = true
  processes = ["web"]
  # String form preferred by current flyctl; keep machine warm (no idle stop).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[env]
  RUN_MODE = "web"
  # Web serves HTTP; the inline worker owns schedulers and the persistent volume.
  BACKGROUND_ON_WEB = "off"
  INLINE_WORKER = "1"
  ENABLE_INLINE_WORKER = "1"
  WORKER_SPLIT_V2 = "off"
  # essential = pump/resolver/whale on worker; full adds live-subnet wedge (2GB+ only).
  WORKER_HEAVY = "essential"
  # auto: start Telethon listener when session exists on worker volume (see DEPLOY.md).
  MESSAGE_INTEL_LISTENER = "auto"
  # SS-TG W6: Bot API /summary in group — separate from Telethon user-session listener.
  TELEGRAM_SUMMARY_BOT = "on"
  RESOLVER_REFRESH_MINUTES = "15"
  # Defer heavy resolver tick on boot — immediate=True wedges single-worker Fly.
  RESOLVER_BOOT_IMMEDIATE = "off"
  BOOT_BACKGROUND_SYNC_IMMEDIATE = "off"
  SUBNETS_LOAD_TIMEOUT_SECONDS = "6"
  HYDRATE_SUBNETS_TIMEOUT_SECONDS = "4"
  LIVE_SUBNETS_BATCH_DEADLINE_SECONDS = "85"
  # Fix live-subnet wedge 2026-08-12: fail fast per RPC so the 75-subnet price batch
  # finishes inside the sync budget instead of each stuck subnet burning ~47s and
  # piling up overlapping AUTO-sync daemon threads that hammer Blockmachine.
  BLOCKMACHINE_RPC_TIMEOUT_SECONDS = "4"
  BLOCKMACHINE_RPC_RETRIES = "1"
  LIVE_SUBNETS_SYNC_TIMEOUT_SECONDS = "90"
  # Defer live feed + subnet warmup so /health wins the first minutes after deploy.
  BOOT_DEFER_SECONDS = "90"
  MAX_IN_FLIGHT_REQUESTS = "48"
  LOAD_SHED_ACQUIRE_SECONDS = "2"
  HOMEPAGE_BUILD_TIMEOUT = "8"
  HOMEPAGE_SHELL_CACHE_SECONDS = "60"
  # Cap expensive scoring so hydrate storms cannot wedge the single worker (~36s 503).
  SCORE_CACHE_TTL = "120"
  SHORTLIST_CACHE_SECONDS = "180"
  PICK_HANDLER_TIMEOUT_SECONDS = "8"
  HOUR_PICK_CACHE_SECONDS = "60"
  PUMP_ALERTS_CACHE_SECONDS = "60"
  BRAIN_LETTER_TIMEOUT_SECONDS = "8"
  BRAIN_LETTER_CACHE_SECONDS = "60"
  ENABLE_METRICS = "1"
  # Enforce CSP (same policy as prior report-only default).
  CONTENT_SECURITY_POLICY_ENFORCE = "1"
  # Web process: keep CPU for GET / + hydrate; resolver/retrain belongs on worker.
  # Issue #888: hydrate cold price cache on resolve miss so predictions stop expiring ungraded
  CALIBRATION_AUTO_RETRAIN = "off"
  CALIBRATION_HYDRATE_ON_MISS = "true"
  SCORE_SNAPSHOT_MAX_SUBNETS = "40"
  SCORE_SNAPSHOT_WRITE_TIMEOUT_SECONDS = "480"
  SCORING_CAP_MEGA_CEILING_RANK = "10"
  SCORING_CAP_MID_RANK_MIN = "11"
  SCORING_CAP_MID_RANK_MAX = "75"
  CONVICTION_ALERTS_ENABLED = "off"
  PUMP_LADDER_REFRESH_MINUTES = "20"
  PUMP_LADDER_STALE_MINUTES = "12"
  # Never immediate full scan on boot — wedges HTTP on shared VM (white screen / 503).
  PUMP_LADDER_BOOT_IMMEDIATE = "off"
  # Inline worker first pump scan — 120s wedge killed prod after #480; 5min still wedged.
  PUMP_LADDER_INLINE_DEFER_SECONDS = "300"
  # Periodic pump scheduler re-enabled after O(n²) intel-map fix in fetch_all_subnet_signals.
  PUMP_LADDER_INLINE_SCHEDULER = "on"
  # Council publish + audit calibration (see confidence_calibration.py, red_team.py).
  DAILY_PICK_PUBLISH_GATE = "0.40"
  RED_TEAM_MAX_HAIRCUT = "0.12"
  PICK_AUDIT_ENABLED = "on"
  PICK_AUDIT_SLOT_UTC_HOUR = "23"
  PICK_AUDIT_SLOT_UTC_MINUTE = "45"
  PUMP_DESK_SNAPSHOT_ENABLED = "on"
  PUMP_DESK_SNAPSHOT_MINUTES = "15"
  OUTCOME_SNAPSHOT_ENABLED = "on"
  OUTCOME_SNAPSHOT_UTC_HOUR = "4"
  OUTCOME_SNAPSHOT_UTC_MINUTE = "50"
  OUTCOME_SNAPSHOT_INTERVAL_HOURS = "6"
  WHALE_LEDGER_WARM_INTERVAL_MINUTES = "20"
  # O4: allow fly.dev + cryptoreporthub hostnames when DNS is pointed (see DEPLOY.md)
  ALLOWED_ORIGINS = "https://subnet-dashboard.fly.dev,https://dashboard.cryptoreporthub.com,https://cryptoreporthub.com"
  # Fix 2026-08-10: concurrency + OG/canonical origin (out-of-harness)
  APP_BASE_URL = "https://subnet-dashboard.fly.dev"
  AIO_WORKER_POOL_SIZE = "24"
  LEARNING_HEALTH_TIMEOUT_SECONDS = "20"
  LEARNING_STATS_TIMEOUT_SECONDS = "15"
  RESOLVER_STATE_TIMEOUT_SECONDS = "15"
  LEARNING_SNAPSHOT_PREWARM_SECONDS = "10"
  WORKER_HTTP_PORT = "8081"
  # Legacy worker-proxy settings retained for compatible API shapes; v1 uses the inline worker.
  WORKER_PROXY_TIMEOUT_SECONDS = "4"
  WORKER_PROXY_CONNECT_SECONDS = "3"
  WORKER_PEER_TIMEOUT_SECONDS = "4"
  WORKER_PROXY_CIRCUIT_OPEN_SECONDS = "30"
  WORKER_PROXY_MINDMAP_TIMEOUT_SECONDS = "4"
  WORKER_PROXY_LEARNING_TIMEOUT_SECONDS = "25"

# Persistent volume for runtime/learning data (soul_map.json, predictions.json,
# SQLite caches under /app/data). The v1 web machine owns the volume.
[mounts]
  source = "data_volume"
  destination = "/app/data"
  processes = ["web"]

[[vm]]
  size = "performance-1x"
  memory = "4gb"
  processes = ["web"]


